<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <title>陪你久久｜健康紀錄</title>
  <script>window.F1A_CONFIG = <?!= JSON.stringify(app) ?>;</script>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#23312d;background:#f7f8f4;font-size:16px;line-height:1.5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}.card{background:#fff;border:1px solid #e5eae5;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 5px 20px #24352c0a}h1{font-size:25px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.hint{font-size:14px;color:#64716b;margin:4px 0 0}.field{padding:13px 0;border-bottom:1px solid #edf0ed}.field:last-child{border:0;padding-bottom:2px}label{display:block;font-weight:650;margin-bottom:7px}.unit{font-size:13px;color:#75817b;font-weight:400;margin-left:5px}.pair,.periods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control{width:100%;border:1px solid #d6dfd9;border-radius:11px;padding:12px;font:inherit;background:#fff;color:inherit}.check{display:flex;align-items:center;gap:10px}.check input{width:20px;height:20px;accent-color:#357664}.actions{display:grid;gap:10px;margin-top:15px}.btn{border:0;border-radius:12px;padding:13px 15px;font:inherit;font-weight:700;background:#357664;color:white}.btn:disabled{opacity:.55}.status{font-size:14px;min-height:22px;margin:12px 2px}.status.error{color:#b42318}.status.ok{color:#26724e}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{display:flex;align-items:center;gap:12px;min-width:0}.toast{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.35)}.toast[hidden]{display:none}.toast div{min-width:230px;padding:24px 28px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.2)}.toast span{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:#357664;color:#fff;font-size:30px}.toast strong{display:block;font-size:20px}.toast small{display:block;margin-top:4px;font-size:14px;color:#64716b}.badge{flex:none;white-space:nowrap;font-size:12px;color:#52645b;background:#eef3ef;padding:4px 8px;border-radius:99px}.alert{font-size:13px;margin:9px 0 0;padding:9px 11px;border-radius:10px;background:#f1f4f1;color:#52645b}.alert.warn{background:#fff1ec;color:#9a3412}.period-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.period-tab{padding:10px 4px;border:1px solid #dce5de;border-radius:10px;background:#fff;color:#365b4e;font:inherit;font-size:14px;font-weight:650}.period-tab[aria-pressed=true]{background:#357664;border-color:#357664;color:#fff}textarea{min-height:78px;resize:vertical}
  </style>
</head>
<body>
<main class="wrap">
  <div class="topline"><div class="title"><!--hub-menu--><div><h1>健康紀錄</h1><p class="hint">依家庭設定顯示要記錄的項目。</p></div></div><span id="member" class="badge">連線中</span></div>

  <form class="card hidden" id="recordForm">
    <h2>每日紀錄</h2>
    <div class="field"><label for="recordDate">紀錄日期</label><input class="control" type="date" id="recordDate" required></div>
    <div class="field"><label>選擇紀錄時段</label><div id="periodTabs" class="period-tabs" role="group" aria-label="紀錄時段"></div><p class="hint" id="periodHint"></p></div>
    <p class="hint">異常提醒是一般參考，請以醫療人員提供的個人目標為準。</p>
    <div id="recordFields"></div>
    <div class="field"><label for="note">備註（選填）</label><textarea class="control" id="note" maxlength="500" placeholder="例如：飯後測量"></textarea></div>
    <div class="actions"><button class="btn" id="saveRecord" type="submit">儲存並返回 LINE</button></div>
  </form>
  <section class="card hidden" id="returnCard" role="status" aria-live="polite"><h2 id="returnTitle">紀錄已儲存</h2><div id="warningList"></div><p class="hint" id="returnMessage">正在返回 LINE 官方帳號…</p><div class="actions"><a id="showDashboard" href="?page=dashboard" hidden>查看健康摘要</a><button class="btn" id="returnToLine" type="button">返回 LINE 官方帳號</button></div></section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<div id="toast" class="toast" role="alert" hidden><div><span aria-hidden="true">✓</span><strong>儲存成功</strong><small id="toastHint"></small></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(() => {
  const cfg = window.F1A_CONFIG || {};
  if (cfg.dashboardUrl) { const link=document.getElementById("showDashboard"); link.href=cfg.dashboardUrl; link.hidden=false; }
  const $ = (id) => document.getElementById(id);
  let token = "", metrics = [], enabledKeys = new Set();
  const medPeriods = [["morning","早上"],["noon","中午"],["evening","晚上"],["bedtime","睡前"]];
  let selectedPeriod="morning",periodDrafts={}, pendingSubmission;
  function taipeiDate(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const date=Object.fromEntries(parts.map(p=>[p.type,p.value]));return [date.year,date.month,date.day].join("-");}
  function suggestedPeriod(){const h=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",hour:"2-digit",hourCycle:"h23"}).format(new Date()));return h<11?"morning":h<15?"noon":h<20?"evening":"bedtime";}
  function capturePeriodDraft(){const draft={};document.querySelectorAll("#recordFields [data-metric]").forEach(input=>{const key=input.dataset.part?`${input.dataset.metric}:${input.dataset.part}`:input.dataset.metric;draft[key]=input.type==="checkbox"?input.checked:input.value;});draft.note=$("note").value;return draft;}
  function restorePeriodDraft(key){const draft=periodDrafts[key]||{};document.querySelectorAll("#recordFields [data-metric]").forEach(input=>{const field=input.dataset.part?`${input.dataset.metric}:${input.dataset.part}`:input.dataset.metric;const value=draft[field];if(input.type==="checkbox")input.checked=value===true;else input.value=value||"";input.dispatchEvent(new Event(input.type==="checkbox"?"change":"input",{bubbles:true}));});$("note").value=draft.note||"";}
  function clearPeriodDrafts(){periodDrafts={};document.querySelectorAll("#recordFields [data-metric]").forEach(input=>{if(input.type==="checkbox")input.checked=false;else input.value="";input.dispatchEvent(new Event(input.type==="checkbox"?"change":"input",{bubbles:true}));});$("note").value="";}
  function selectPeriod(key){if(selectedPeriod!==key)periodDrafts[selectedPeriod]=capturePeriodDraft();selectedPeriod=key;document.querySelectorAll(".period-tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.period===key)));$("periodHint").textContent=`目前記錄：${medPeriods.find(([k])=>k===key)?.[1]||"早上"}時段`;
    restorePeriodDraft(key);
  }
  function buildPeriodTabs(){const root=$("periodTabs");root.replaceChildren(...medPeriods.map(([key,label])=>{const b=document.createElement("button");b.type="button";b.className="period-tab";b.textContent=label;b.dataset.period=key;b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>selectPeriod(key));return b;}));$("recordDate").value=taipeiDate();$("recordDate").addEventListener("change",()=>{clearPeriodDrafts();selectPeriod(suggestedPeriod());});selectPeriod(suggestedPeriod());}
  const status = (message, type="") => { $("status").textContent = message; $("status").className = `status ${type}`; };
  async function api(action, extra={}) {
    const response = await (window.hubPrefetch?.(action) || fetch(cfg.apiUrl, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,accessToken:token,...extra})}));
    let data; try { data = await response.json(); } catch { throw new Error("伺服器回覆格式錯誤"); }
    if (!response.ok || data.ok === false) throw new Error(data.error || `連線失敗（${response.status}）`);
    return data;
  }
  function createField(m) {
    const box = document.createElement("div"); box.className = "field";
    const label = document.createElement("label"); label.textContent = m.metricName;
    if (m.unit) { const u=document.createElement("span");u.className="unit";u.textContent=m.unit;label.append(u); }
    box.append(label);
    if (m.inputType === "bloodPressure") {
      const pair=document.createElement("div");pair.className="pair";
      [["systolic","收縮壓"],["diastolic","舒張壓"]].forEach(([key,txt])=>{const i=document.createElement("input");i.className="control";i.type="number";i.min="1";i.max="300";i.placeholder=txt;i.setAttribute("aria-label",txt);i.dataset.metric=m.metricKey;i.dataset.part=key;pair.append(i);});
      box.append(pair);const alert=document.createElement("p");alert.className="alert hidden";alert.dataset.alert=m.metricKey;box.append(alert);const update=()=>{const hits=[];[["收縮壓","systolic"],["舒張壓","diastolic"]].forEach(([label,key])=>{const input=pair.querySelector(`[data-part=${key}]`),value=Number(input.value),low=m[`${key}Low`],high=m[`${key}High`];if(input.value!==""&&low!=null&&value<Number(low))hits.push(`${label} ${value} 低於 ${low}`);if(input.value!==""&&high!=null&&value>Number(high))hits.push(`${label} ${value} 高於 ${high}`);});alert.textContent=hits.length?`超出設定標準：${hits.join("；")} mmHg。單次讀值僅供提醒，請依個人醫囑判讀。`:"";alert.className=`alert ${hits.length?"warn":"hidden"}`;};pair.querySelectorAll("input").forEach(i=>i.addEventListener("input",update));
    } else if (m.inputType === "boolean" && m.metricKey === "medication") {
      const row=document.createElement("label");row.className="check";const i=document.createElement("input");i.type="checkbox";i.dataset.metric=m.metricKey;row.append(i,document.createTextNode("這個時段已用藥"));box.append(row);
    } else if (m.inputType === "boolean") {
      const row=document.createElement("label");row.className="check";const i=document.createElement("input");i.type="checkbox";i.dataset.metric=m.metricKey;row.append(i,document.createTextNode("今天已完成"));box.append(row);
    } else {
      const i=document.createElement("input");i.className="control";i.type="number";i.step="any";i.dataset.metric=m.metricKey;i.inputMode="decimal";i.setAttribute("aria-label",m.metricName);box.append(i);
      const alert=document.createElement("p");alert.className="alert hidden";alert.dataset.alert=m.metricKey;box.append(alert);
      const low=m.alertLow,high=m.alertHigh;const updateAlert=()=>{const v=Number(i.value),hits=[];if(i.value!==""&&low!=null&&v<Number(low))hits.push(`低於 ${low}`);if(i.value!==""&&high!=null&&v>Number(high))hits.push(`高於 ${high}`);const msg=hits.length?`超出設定標準：${hits.join("、")}${m.unit?` ${m.unit}`:""}。請依個人醫囑判讀。`:"";alert.textContent=msg;alert.className=`alert ${msg?"warn":"hidden"}`;};i.addEventListener("input",updateAlert);
    }
    return box;
  }
  function render(data) {
    metrics = data.metrics || [];periodDrafts={};
    $("member").textContent = data.role === "admin" ? "管理者" : "成員";
    const settings=data.settings || {}; enabledKeys = new Set(Object.keys(settings).filter(k=>settings[k]));
    const formMetrics=metrics.filter(m=>m.isActive && enabledKeys.has(m.metricKey));
    const fields=$("recordFields");fields.replaceChildren(...formMetrics.map(createField));
    $("recordDate").value=taipeiDate();buildPeriodTabs();
    $("recordForm").classList.toggle("hidden",formMetrics.length===0);
    if (!formMetrics.length) status("目前沒有啟用的追蹤項目，請由管理者到 GAS 儀表板「健康標準設定」調整。","");
  }
  $("recordForm").addEventListener("submit",async(e)=>{
    e.preventDefault();const button=$("saveRecord");button.disabled=true;status("正在儲存紀錄…");
    try {
      const values={};
      metrics.filter(m=>m.isActive&&enabledKeys.has(m.metricKey)).forEach(m=>{
        if(m.inputType==="bloodPressure") {const a=$("recordFields").querySelector(`[data-metric="${m.metricKey}"][data-part="systolic"]`).value;const b=$("recordFields").querySelector(`[data-metric="${m.metricKey}"][data-part="diastolic"]`).value;if(a!==""&&b!=="")values[m.metricKey]=`${a}/${b}`;}
        else if(m.inputType==="boolean"&&m.metricKey==="medication"){const i=$("recordFields").querySelector(`[data-metric="${m.metricKey}"]`);values[m.metricKey]=i.checked;}
        else if(m.inputType==="boolean"){const i=$("recordFields").querySelector(`[data-metric="${m.metricKey}"][type="checkbox"]`);if(i.checked)values[m.metricKey]=true;}
        else {const i=$("recordFields").querySelector(`[data-metric="${m.metricKey}"]`);if(i.value!=="")values[m.metricKey]=Number(i.value);}
      });
      if(!$('recordDate').value)throw new Error("請選擇紀錄日期。");
      const medication=metrics.find(m=>m.metricKey==="medication"&&m.inputType==="boolean"&&enabledKeys.has(m.metricKey));
      if(medication){const label=medPeriods.find(([key])=>key===selectedPeriod)?.[1]||"目前";if(!window.confirm(`要記錄「${label}」時段的用藥狀態嗎？\n按「確定」表示已用藥；按「取消」表示尚未用藥。`))values.medication=false;else values.medication=true;}
      if(!Object.keys(values).length)throw new Error("請至少填寫一個項目。");
      const submission={values,recordDate:$("recordDate").value,period:selectedPeriod,note:$("note").value};
      const signature=JSON.stringify(submission);
      if(pendingSubmission?.signature!==signature)pendingSubmission={signature,requestId:crypto.randomUUID()};
      const result=await api("record",{...submission,requestId:pendingSubmission.requestId});pendingSubmission=null;e.target.reset();$("recordDate").value=taipeiDate();showSavedAndReturn(result.warnings||[]);
    } catch(err){status(err.message,"error");$("status").scrollIntoView({block:"nearest"});} finally {button.disabled=false;}
  });
  function showSavedAndReturn(warnings=[]){
    $("recordForm").classList.add("hidden");$("returnCard").classList.remove("hidden");$("status").textContent="";
    const list=$("warningList");list.replaceChildren();
    if(warnings.length){$("returnTitle").textContent="紀錄已儲存，請留意數值變化";warnings.forEach(w=>{const p=document.createElement("p");p.className="alert warn";const change=Number(w.delta);p.textContent=`${w.metricName||w.label||w.metricKey}：前日 ${w.previous}${w.unit||""} → 今日 ${w.current}${w.unit||""}（${change>0?"增加":"減少"} ${Math.abs(change)}${w.unit||""}，達到提醒門檻 ${w.threshold}${w.unit||""}）。此提醒僅供參考，請依醫療人員建議判讀。`;list.append(p);});$("returnMessage").textContent="提醒已顯示，5 秒後返回 LINE；也可以立即返回。";showToast("請留意下方提醒",1800);window.setTimeout(()=>returnToLine(true),5000);}
    else {$("returnTitle").textContent="紀錄已儲存";$("returnMessage").textContent="即將返回 LINE 官方帳號…";showToast("即將返回 LINE…",2000,()=>returnToLine(true));}
  }
  function showToast(hint,duration,done){
    $("toastHint").textContent=hint;$("toast").hidden=false;
    window.setTimeout(()=>{$("toast").hidden=true;done?.();},duration);
  }
  function returnToLine(automatic=false){
    const fallback=()=>{
      if(document.hidden)return;
      if(cfg.lineChatUrl){window.location.assign(cfg.lineChatUrl);return;}
      if(!automatic&&cfg.lineChatUrl){window.open(cfg.lineChatUrl,"_top");return;}
      $("returnMessage").textContent="資料已儲存。若仍停在此頁，請點 LINE 視窗左上角的關閉按鈕，回到官方帳號聊天畫面。";
    };
    try {
      if(window.liff&&liff.isInClient()){
        liff.closeWindow();
        window.setTimeout(fallback,900);
        return;
      }
    } catch {}
    if(automatic){$("returnMessage").textContent="資料已儲存。若未自動返回，請按下方按鈕返回 LINE。";return;}
    fallback();
  }
  $("returnToLine").addEventListener("click",()=>returnToLine(false));
  async function start(){
    if(!cfg.liffId||cfg.liffId.startsWith("REPLACE")){status("請先設定 LIFF ID（LIFF_ID）。","error");return;}
    if(!cfg.apiUrl){status("每日紀錄 API 未設定。","error");return;}
    try {if(window.hubSession){if(!await window.hubSession)return;}else await liff.init({liffId:cfg.liffId});if(!liff.isLoggedIn()){liff.login();return;}}
    catch(e){status("LIFF 初始化失敗，請稍後重試。","error");return;}
    try {token=liff.getAccessToken();if(!token)throw new Error("尚未取得登入憑證");const data=await api("read");render(data);status("健康設定已載入，可開始填寫今日紀錄。","ok");}
    catch(e){status(e.message,"error");}
  }
  start();
})();
</script>
</body>
</html>
