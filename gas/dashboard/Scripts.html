<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const CFG=window.HUB_CONFIG||{};const state={patientId:null,days:7,metric:'bp',display:'chart',data:null,view:CFG.page==='summary'?'summary':'dashboard',request:0,token:''};const T0=performance.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit'}):'—';
const number=n=>n===null||n===undefined?'—':n;
async function call(name,...args){
  if (!CFG.apiUrl) return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  const [idToken, second, third] = args;
  const payload = name === 'getHubData' ? {days:second} : {patientId:second,days:third};
  const response = await (window.hubPrefetch?.(name) || fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,idToken,...payload})}));
  const result = await response.json();
  if (!response.ok || !result.ok) throw new Error(result.error || '連線失敗');
  return result.data;
}
async function getToken(){if(window.hubSession)return await window.hubSession?(liff.getAccessToken()||liff.getIDToken()):null;if(CFG.liffId&&window.liff){const t=performance.now();await liff.init({liffId:CFG.liffId});if(!liff.isLoggedIn()){if(!CFG.apiUrl)throw new Error('[UNAUTHENTICATED]');liff.login();return null;}console.info('[perf] liff.init',Math.round(performance.now()-t),'ms');return liff.getAccessToken()||liff.getIDToken();}return '';}
function friendly(e){const m=String(e&&e.message||e);const c=(m.match(/\[([A-Z_]+)\]/)||[])[1];const map={NOT_MEMBER:'尚未加入照護家庭，請回到 LINE 點「建立照護家庭」。',UNAUTHENTICATED:'登入已失效，請從 LINE 重新開啟。',FORBIDDEN:'無權存取此資料。',CONFIG:'系統設定未完成，請聯絡管理員。'};return map[c]||m.replace(/^Error:\s*/,'');}
function error(e){$('message').hidden=false;$('message').textContent=friendly(e);}
function busy(v){$('loading').hidden=!v;$('app').hidden=v;}
async function init(){try{busy(true);state.token=await getToken();if(state.token===null)return;const r=await call('getHubData',state.token,state.days);const boot=r.context;if(r.meta.devMode){$('devBanner').hidden=false;}$('patient').innerHTML=boot.patients.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}（${esc(p.role)}）</option>`).join('');state.patientId=boot.patients[0].id;state.data=r.dashboard;console.info('[perf] server',JSON.stringify(r.meta.timings),'total',Math.round(performance.now()-T0),'ms');render();busy(false);}catch(e){busy(false);$('app').hidden=true;$('loading').hidden=false;$('loading').textContent=friendly(e);}}
async function load(){const id=++state.request;try{$('message').hidden=true;$('chart').innerHTML='<div class="center">載入中…</div>';const d=await call('getDashboardData',state.token,state.patientId,state.days);if(id!==state.request)return;state.data=d;render();busy(false);}catch(e){if(id===state.request){busy(false);error(e);}}}
function render(){const d=state.data;const bp=d.latestBP;$('latestBP').textContent=bp?`${bp.systolic}/${bp.diastolic}`:'—';$('latestTime').textContent=bp?'血壓 '+date(bp.record_date||bp.measured_at):'尚無血壓紀錄';$('avgBP').textContent=d.bpAverage.sys===null?'—':`${d.bpAverage.sys}/${d.bpAverage.dia}`;$('avgGlucose').textContent='血糖平均 '+number(d.glucoseAverage)+' mg/dL';$('medRate').textContent=d.medication.rate===null?'—':d.medication.rate+'%';$('medCount').textContent=`已回報 ${d.medication.taken} / 預定 ${d.medication.total} 次`;
const next=d.nextAppointment;const days=next?Math.ceil((new Date(next.scheduled_at)-new Date())/86400000):null;$('nextVisit').textContent=next?days+' 天':'—';$('visitDetail').textContent=next?date(next.scheduled_at)+' '+next.department:'尚無回診';renderChart();renderSummary();showView();}
function showView(){$('pageTitle').textContent=state.view==='summary'?'就診摘要':'健康摘要';$('dashboard').hidden=state.view!=='dashboard';$('summary').hidden=state.view!=='summary';$('summaryBtn').textContent=state.view==='summary'?'← 儀表板':'就診摘要 →';}
window.hubShowSummary=on=>{state.view=on?'summary':'dashboard';if(state.data)showView();window.scrollTo(0,0);};
function lineChart(series,labels,bands){if(!series.length)return '<div class="center">這段期間尚無紀錄</div>';const width=330,height=190,left=35,right=12,top=15,bottom=28;const all=series.flatMap(s=>s.values).filter(Number.isFinite);if(!all.length)return '<div class="center">沒有可繪製的數值</div>';const min=Math.max(0,Math.floor((Math.min(...all)-10)/10)*10),max=Math.ceil((Math.max(...all)+10)/10)*10;const x=i=>left+i*(width-left-right)/Math.max(1,labels.length-1);const y=v=>top+(max-v)/(max-min||1)*(height-top-bottom);const colors=['#39745b','#e09a55'];let svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="健康紀錄趨勢圖">`;for(let i=0;i<4;i++){const yy=top+i*(height-top-bottom)/3;svg+=`<line x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}" stroke="#e2e9e4"/><text x="1" y="${yy+4}" font-size="10" fill="#77887e">${Math.round(max-i*(max-min)/3)}</text>`;}(bands||[]).forEach(b=>{if(b&&Number.isFinite(b.low)&&Number.isFinite(b.high)&&b.high>b.low){svg+=`<rect x="${left}" y="${y(b.high)}" width="${width-left-right}" height="${y(b.low)-y(b.high)}" fill="${b.color}"/>`;}});
series.forEach((s,j)=>{svg+=`<polyline fill="none" stroke="${colors[j%2]}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" ${j?'stroke-dasharray="6 4"':''} points="${s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;});svg+=`<text x="${left}" y="${height-3}" font-size="10" fill="#77887e">${esc(labels[0])}</text><text x="${width-58}" y="${height-3}" font-size="10" fill="#77887e">${esc(labels[labels.length-1])}</text></svg>`;return svg;}
function table(head,rows){return '<table class="data"><thead><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c&&c.html!==undefined?c.html:esc(c===null||c===undefined||c===''?'—':c))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+head.length+'">這段期間尚無紀錄</td></tr>')+'</tbody></table>';}
function renderChart(){const d=state.data;const t=d.targets||{};const showTable=state.display==='table';const labels=state.metric==='bp'?d.bp.map(x=>date(x.record_date||x.measured_at)):d.glucose.map(x=>date(x.record_date||x.measured_at));document.querySelectorAll('#metricTabs button').forEach(b=>b.classList.toggle('active',b.dataset.metric===state.metric));document.querySelectorAll('#periodTabs button').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===state.days));document.querySelectorAll('#displayTabs button').forEach(b=>b.classList.toggle('active',b.dataset.display===state.display));
if(state.metric==='bp'){$('chartTitle').textContent='血壓'+(showTable?'數據':'趨勢');
  if(showTable){$('chart').innerHTML=table(['日期','收縮壓','舒張壓'],d.bp.map(x=>[date(x.record_date||x.measured_at),x.systolic,x.diastolic]));}
  else{$('chart').innerHTML=lineChart([{values:d.bp.map(x=>Number(x.systolic))},{values:d.bp.map(x=>Number(x.diastolic))}],labels,[t.systolic&&{low:t.systolic.low,high:t.systolic.high,color:'rgba(57,116,91,.13)'},t.diastolic&&{low:t.diastolic.low,high:t.diastolic.high,color:'rgba(224,154,85,.13)'}]);}
  $('chartNote').textContent=showTable?'':'綠色實線：收縮壓；橘色虛線：舒張壓（mmHg）。淺色帶為目標範圍。';}
else if(state.metric==='glucose'){$('chartTitle').textContent='血糖'+(showTable?'數據':'趨勢');
  if(showTable){$('chart').innerHTML=table(['日期','血糖（mg/dL）'],d.glucose.map(x=>[date(x.record_date||x.measured_at),x.value]));}
  else{$('chart').innerHTML=lineChart([{values:d.glucose.map(x=>Number(x.value))}],labels,[t.glucose&&{low:t.glucose.low,high:t.glucose.high,color:'rgba(57,116,91,.13)'}]);}
  $('chartNote').textContent=showTable?'':'血糖量測情境（空腹／飯後）需分開解讀，本圖僅呈現紀錄值。淺色帶為目標範圍。';}
else{const m=d.medication;
  if(showTable){$('chartTitle').textContent='用藥詳細';
    const cell=x=>{if(x.status==='taken')return {html:x.counted?'<span class="mk-ok" aria-label="已吃，計入用藥率">✓</span>':'<span class="mk-off" aria-label="已吃，未計入用藥率">✓</span>'};if(x.status==='cancelled')return {html:'取消'};return {html:'—'};};
    if(!m.allSlots||!m.rows){$('chart').innerHTML='<div class="center">這個版本尚未提供用藥明細，請重新整理頁面；仍無法顯示時請通知管理者。</div>';$('chartNote').textContent='';return;}
    $('chart').innerHTML='<style>.mk-ok{color:#38775c;font-weight:700}.mk-off{color:#9aa59f;font-weight:700}</style>'+table(['日期',...m.allSlots],m.rows.map(r=>[{html:date(r.date)},...r.slots.map(cell)]));
    $('chartNote').innerHTML='<span class="mk-ok">✓</span> 綠色：已吃，計入用藥率。<br><span class="mk-off">✓</span> 灰色：有打卡，但這個時段沒有登錄用藥，<b>不計入用藥率</b>。<br>— 未打卡；取消 為取消打卡（今天還沒到的時段會先顯示為 —）。';}
  else{$('chartTitle').textContent='用藥紀錄';
    const big=m.rate===null?'未設定藥物':m.rate+'%';
    $('chart').innerHTML=`<div class="center"><strong style="font-size:${m.rate===null?'22px':'44px'};color:#38775c">${big}</strong><p>${m.total?`已吃 ${m.taken} 次／應吃 ${m.total} 次`:'家人尚未設定藥物，LINE 打卡仍會記錄在「數據」'}</p><p>點「數據」可看每天每個時段</p></div>`;
    $('chartNote').textContent='依打卡計算：應吃 = 每天的用藥時段數 × 天數。不代表實際服藥情形。';}}}
function renderSummary(){const d=state.data;const item=(label,val)=>`<div class="stat"><span>${esc(label)}</span><strong>${esc(val)}</strong></div>`;$('summaryBody').innerHTML=`<section class="summary-card"><h3>患者資料</h3>${item('姓名',d.patient.name)}${item('出生年份',d.patient.birthYear)}${item('慢性病',d.patient.conditions||'未填寫')}${item('過敏史',d.patient.allergies||'未填寫')}</section><section class="summary-card"><h3>最近 ${d.days} 天紀錄</h3>${item('平均血壓',d.bpAverage.sys===null?'無資料':d.bpAverage.sys+'/'+d.bpAverage.dia+' mmHg')}${item('血糖平均',d.glucoseAverage===null?'無資料':d.glucoseAverage+' mg/dL')}${item('用藥紀錄',d.medication.taken+' / '+d.medication.total+' 次')}${item('血壓紀錄數',d.bp.length+' 筆')}${d.quality&&(d.quality.excludedInvalid||d.quality.excludedTest)?item('未納入統計',(d.quality.excludedInvalid||0)+' 筆異常／'+(d.quality.excludedTest||0)+' 筆測試'):''}${item('血糖紀錄數',d.glucose.length+' 筆')}</section><section class="summary-card"><h3>目前登錄藥物</h3>${d.medications.length?d.medications.map(m=>`<p>• ${esc(m.name)} ${esc(m.dose)}（每日預定 ${esc(m.schedule_per_day)} 次）</p>`).join(''):'<p>尚無藥物資料</p>'}</section><section class="summary-card"><h3>想詢問醫師的問題</h3>${d.questions.length?d.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join(''):'<p>尚無問題</p>'}</section>`;}
$('patient').addEventListener('change',e=>{state.patientId=e.target.value;state.view='dashboard';load();});$('metricTabs').addEventListener('click',e=>{const b=e.target.closest('[data-metric]');if(b){state.metric=b.dataset.metric;renderChart();}});$('periodTabs').addEventListener('click',e=>{const b=e.target.closest('[data-days]');if(b){state.days=Number(b.dataset.days);load();}});$('summaryBtn').addEventListener('click',()=>window.hubShowSummary(state.view!=='summary'));$('backBtn').addEventListener('click',()=>{state.view='dashboard';showView();});$('pdfBtn').addEventListener('click',async()=>{const btn=$('pdfBtn');btn.disabled=true;btn.textContent='正在產生 PDF…';try{const r=await call('generateVisitPdf',state.token,state.patientId,state.days);if(r.url){if(window.liff&&liff.isInClient())liff.openWindow({url:r.url,external:true});else location.href=r.url;return;}const binary=atob(r.base64);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}catch(e){error(e);}finally{btn.disabled=false;btn.textContent='下載 PDF 摘要';}});$('displayTabs').addEventListener('click',e=>{const b=e.target.closest('[data-display]');if(b){state.display=b.dataset.display;renderChart();}});init();
})();
</script>
