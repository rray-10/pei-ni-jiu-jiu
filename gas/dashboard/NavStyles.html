<style>
/* Hub 導覽：桌面左側固定 Sidebar；手機以抽屜開啟。不改動原 Styles.html。 */
.hub{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;z-index:30;overflow-y:auto}
.sidebar .brand{padding:0 8px 16px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;min-height:44px}
.sidebar a:hover{background:var(--light)}
.sidebar a[aria-current="page"]{background:var(--green);color:#fff}
.sidebar a.disabled{color:#a3b0a8;pointer-events:none}
.content{flex:1;min-width:0;margin-left:220px}
.menu-btn,.scrim{display:none}
.devbanner{background:#fff4d6;color:#785c21;padding:8px 16px;font-size:12px;text-align:center}
@media(max-width:800px){
 .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.12)}
 body.nav-open .sidebar{transform:none}
 .content{margin-left:0}
 .menu-btn{display:inline-flex;background:#fff;border:1px solid var(--line);color:var(--green);min-width:44px;min-height:44px;align-items:center;justify-content:center;font-size:20px}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
 body.nav-open .scrim{display:block}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>
