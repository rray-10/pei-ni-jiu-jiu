<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;font-size:12px;color:#26382f;margin:28px}h1{font-size:22px;color:#38775c}h2{font-size:15px;border-bottom:1px solid #ccd9d0;padding-bottom:5px}table{width:100%;border-collapse:collapse;margin:10px 0 20px}td,th{padding:9px;border:1px solid #dce6df;text-align:left}.note{font-size:10px;color:#777}</style></head><body><h1>陪你久久｜就診健康摘要</h1><p>患者：<?= data.patient.name ?>　｜　最近 <?= data.days ?> 天</p><p>產生時間：<?= data.generatedAt ?></p><h2>基本資料</h2><p>出生年份：<?= data.patient.birthYear ?>　慢性病：<?= data.patient.conditions ?>　過敏史：<?= data.patient.allergies ?></p><h2>健康紀錄統計</h2><table><tr><th>項目</th><th>平均</th><th>最高</th><th>最低</th></tr><tr><td>收縮壓</td><td><?= data.bpAverage.sys ?? '—' ?></td><td><?= data.bpSysStats.max ?? '—' ?></td><td><?= data.bpSysStats.min ?? '—' ?></td></tr><tr><td>舒張壓</td><td><?= data.bpAverage.dia ?? '—' ?></td><td><?= data.bpDiaStats.max ?? '—' ?></td><td><?= data.bpDiaStats.min ?? '—' ?></td></tr><tr><td>血糖</td><td><?= data.glucoseAverage ?? '—' ?></td><td><?= data.glucoseStats.max ?? '—' ?></td><td><?= data.glucoseStats.min ?? '—' ?></td></tr></table><p>用藥紀錄：<?= data.medication.taken ?> / <?= data.medication.total ?> 次（<?= data.medication.rate ?? '—' ?>%）</p><h2>目前登錄藥物</h2><? for (const m of data.medications) { ?><p>• <?= m.name ?> <?= m.dose ?>（每日預定 <?= m.schedule_per_day ?> 次）</p><? } ?><h2>想詢問醫師的問題</h2><? for (let i=0;i<data.questions.length;i++) { ?><p><?= i+1 ?>. <?= data.questions[i] ?></p><? } ?><p class="note">此摘要依使用者自行輸入之測試紀錄產生，僅供就診參考，不代表醫療診斷。用藥紀錄不等於實際服藥。</p></body></html>
