<script>
(function(){
  var b=document.body,m=document.getElementById('menuBtn'),s=document.getElementById('scrim');
  function set(o){b.classList.toggle('nav-open',o);m.setAttribute('aria-expanded',String(o));}
  m.addEventListener('click',function(){set(!b.classList.contains('nav-open'));});
  s.addEventListener('click',function(){set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
  document.getElementById('navSummary').addEventListener('click',function(e){e.preventDefault();set(false);document.getElementById('summaryBtn').click();});
})();
</script>
